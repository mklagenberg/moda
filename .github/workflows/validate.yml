name: Validate MODA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate MODA client zero
        run: python scripts/validate_moda.py .
      - name: Validate minimal methodology example
        run: python scripts/validate_moda.py examples/minimal-methodology
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
