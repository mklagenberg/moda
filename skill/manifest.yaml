manifest_version: "1.0"

skill:
  name: "moda"
  version: "1.0.0"
  entrypoint: "SKILL.md"
  canonical_repository: "https://github.com/mklagenberg/moda"
  canonical_path: "skill/"

framework:
  name: "moda"
  compatibility: "^1.0.0"
  verified_against: "1.0.0"
  verified_commit: "81171ed22163f73f250e32534f9edc3a4f8d51e1"

knowledge:
  repository: "https://github.com/mklagenberg/moda"
  snapshot: "81171ed22163f73f250e32534f9edc3a4f8d51e1"
  entrypoints:
    - "SPEC.md"
    - "docs/taxonomy.md"
    - "docs/design-model.md"
    - "docs/repository-contract.md"
    - "docs/conformance-and-audit.md"
    - "docs/synchronization.md"
    - "docs/composition-scaffolding-and-distribution.md"
    - "docs/change-management.md"
    - "docs/decision-records.md"
    - "docs/validation-and-repair.md"
    - "docs/git-and-release-workflow.md"
    - "docs/evaluation-and-safety.md"

synchronization:
  state: "current"
  reason: "The v1.0.0 skill procedures and knowledge entrypoints were validated against the frozen release content."
  audit_triggers:
    - "framework-version-change"
    - "normative-specification-change"
    - "knowledge-entrypoint-change"
    - "skill-procedure-change"
    - "schema-or-template-change"
    - "change-impact-or-release-workflow-change"
  periodic_review: "P90D"

installation:
  scope: "per-person-per-environment"
  lockfile: "skill.lock.yaml"
  automatic_migration: false

updates:
  check_on_first_activation: true
  normal_ttl: "P7D"
  security_ttl: "P1D"
  canonical_manifest: "https://github.com/mklagenberg/moda/releases"
  security_advisories: "https://github.com/mklagenberg/moda/security/advisories"
  unavailable_state: "unknown"
  automatic_self_update: false
