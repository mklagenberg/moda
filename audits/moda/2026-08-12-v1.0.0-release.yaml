resolved_in_review:
  - "MODA-RELEASE-002: bootstrap release evidence now separates the frozen content commit from the evidence-only release commit and requires explicit approval before tagging."
  - "MODA-CONTRACT-002: literal evolution artifacts, semantic paths, Decision Records, Change Sets, and negative fixtures are enforced deterministically."
  - "MODA-COMPOSITION-001: source repositories, distribution packages, generated instances, installations, scaffold profiles, and ownership classes are distinct contracts."
  - "MODA-SKILL-UPDATE-001: the portable skill requires first-activation freshness and security checks, immutable provenance, independent notification channels, and no silent self-update."
  - "MODA-AUDIT-002: audit finding counts, claim stages, conformance states, controls, and evidence references are validated."
  - "MODA-PROVENANCE-002: placeholder commits and unpinned Git package sources are rejected."
  - "MODA-EVIDENCE-002: local Markdown anchors and evidence paths are validated."
  - "MODA-ROADMAP-001: the root roadmap separates future outcomes from release commitments and delivered changelog history."

