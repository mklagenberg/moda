moda:
  manifest_version: "1.0"
  repository: "https://github.com/mklagenberg/moda"
  compatibility: "^1.0.0"
  verified_against: "1.0.0"
  verified_commit: "909c83cd5b82d5840b40eb87f6b2ed4885a71c94"

artifact:
  id: "moda"
  name: "MODA"
  full_name: "Methodology Organization, Design & Audit"
  kind: "framework"
  domain: "agentic-methodology-engineering"
  version: "1.0.0"
  status: "development"
  language: "en"
  repository: "https://github.com/mklagenberg/moda"
  license: "Apache-2.0"

adoption:
  relationship: "designed_with"
  mode: "native"
  claim_stage: "mapped"
  conformance_result: "partial"

documentation:
  human_entrypoint: "README.md"
  agent_entrypoint: "AGENTS.md"
  specification: "SPEC.md"
  getting_started: "GETTING-STARTED.md"
  invariants: "CONSTITUTION.md"
  best_practices: "BEST-PRACTICES.md"
  limitations: "DISCLAIMER.md"
  changelog: "CHANGELOG.md"
  roadmap: "ROADMAP.md"
  upgrade: "UPGRADE.md"
  migrations: "MIGRATIONS.md"
  decisions: "decisions/"
  composition: "docs/composition-scaffolding-and-distribution.md"

components:
  - id: "artifact-taxonomy"
    kind: "model"
    source: "SPEC.md#3-taxonomy"
    lifecycle: "embedded"
  - id: "design-requirements"
    kind: "framework"
    source: "SPEC.md#4-design-requirements"
    lifecycle: "embedded"
  - id: "repository-contract"
    kind: "framework"
    source: "SPEC.md#5-repository-contract"
    lifecycle: "embedded"
  - id: "conformance-audit"
    kind: "method"
    source: "SPEC.md#7-conformance-claims"
    lifecycle: "embedded"
  - id: "composition-scaffolding-distribution"
    kind: "framework"
    source: "docs/composition-scaffolding-and-distribution.md"
    lifecycle: "embedded"

packages:
  specification:
    role: "normative-specification"
    version: "1.0.0"
    source: "SPEC.md"
    source_kind: "local"
  schema:
    role: "machine-contract"
    version: "1.0.0"
    source: "schemas/moda.schema.json"
    source_kind: "local"
  validator:
    role: "deterministic-validator"
    version: "1.0.0"
    source: "scripts/validate_moda.py"
    source_kind: "local"
  skill:
    role: "portable-agent-skill-core"
    version: "1.0.0"
    source: "skill/manifest.yaml"
    source_kind: "local"
  templates:
    role: "adoption-and-scaffold-templates"
    version: "1.0.0"
    source: "templates/"
    source_kind: "local"
  examples:
    role: "evaluation-fixtures"
    version: "1.0.0"
    source: "examples/"
    source_kind: "local"

installations: []

conformance:
  profile: "conformance/moda.yaml"
  latest_audit: "audits/moda/2026-08-12-pre-tag-architecture-review.yaml"
  audit_mode: "self-audit"

synchronization:
  policy: "docs/synchronization.md"
  state: "review-required"
  reason: "The pre-tag review expanded the contract and identified validation and distribution work that must pass before a conformant release claim."
