moda:
  manifest_version: "1.0"
  repository: "https://github.com/mklagenberg/moda"
  compatibility: "^1.0.0"
  verified_against: "1.0.0"
  verified_commit: "81171ed22163f73f250e32534f9edc3a4f8d51e1"

artifact:
  id: "moda"
  name: "MODA"
  full_name: "Methodology Organization, Design & Audit"
  kind: "framework"
  domain: "agentic-methodology-engineering"
  version: "1.0.0"
  status: "active"
  language: "en"
  repository: "https://github.com/mklagenberg/moda"
  license: "Apache-2.0"

adoption:
  relationship: "designed_with"
  mode: "native"
  claim_stage: "verified"
  conformance_result: "conformant"

documentation:
  human_entrypoint: "README.md"
  agent_entrypoint: "AGENTS.md"
  claude_entrypoint: "CLAUDE.md"
  specification: "SPEC.md"
  getting_started: "GETTING-STARTED.md"
  invariants: "CONSTITUTION.md"
  best_practices: "BEST-PRACTICES.md"
  limitations: "DISCLAIMER.md"
  changelog: "CHANGELOG.md"
  roadmap: "ROADMAP.md"
  upgrade: "UPGRADE.md"
  migrations: "MIGRATIONS.md"
  decisions: "decisions/"
  decision_policy: "docs/decision-records.md"
  composition: "docs/composition-scaffolding-and-distribution.md"
  change_management: "docs/change-management.md"
  validation: "docs/validation-and-repair.md"
  git_workflow: "docs/git-and-release-workflow.md"

components:
  - id: "artifact-taxonomy"
    kind: "model"
    source: "SPEC.md#3-taxonomy"
    lifecycle: "embedded"
  - id: "design-requirements"
    kind: "framework"
    source: "SPEC.md#4-design-requirements"
    lifecycle: "embedded"
  - id: "repository-contract"
    kind: "framework"
    source: "SPEC.md#5-repository-contract"
    lifecycle: "embedded"
  - id: "conformance-audit"
    kind: "method"
    source: "SPEC.md#7-conformance-claims"
    lifecycle: "embedded"
  - id: "composition-scaffolding-distribution"
    kind: "framework"
    source: "docs/composition-scaffolding-and-distribution.md"
    lifecycle: "embedded"
  - id: "specification-driven-change-control"
    kind: "protocol"
    source: "SPEC.md#416-specification-driven-change-control"
    lifecycle: "embedded"
  - id: "deterministic-validation-and-repair"
    kind: "protocol"
    source: "SPEC.md#410-quality-and-evaluation"
    lifecycle: "embedded"
  - id: "stable-release-gates"
    kind: "protocol"
    source: "SPEC.md#91-stable-release-gates"
    lifecycle: "embedded"

packages:
  specification:
    role: "normative-specification"
    version: "1.0.0"
    source: "SPEC.md"
    source_kind: "local"
  schema:
    role: "machine-contract"
    version: "1.0.0"
    source: "schemas/"
    source_kind: "local"
  validator:
    role: "deterministic-validators"
    version: "1.0.0"
    source: "scripts/"
    source_kind: "local"
  skill:
    role: "portable-agent-skill-core"
    version: "1.0.0"
    source: "skill/manifest.yaml"
    source_kind: "local"
  templates:
    role: "adoption-and-scaffold-templates"
    version: "1.0.0"
    source: "templates/"
    source_kind: "local"
  examples:
    role: "evaluation-fixtures"
    version: "1.0.0"
    source: "examples/"
    source_kind: "local"

installations: []

conformance:
  profile: "conformance/moda.yaml"
  latest_audit: "audits/moda/2026-08-12-v1.0.0-release.yaml"
  audit_mode: "self-audit"

synchronization:
  policy: "docs/synchronization.md"
  state: "current"
  reason: "The v1.0.0 packages, skill knowledge, conformance profile, and release audit are synchronized to the frozen content commit."
